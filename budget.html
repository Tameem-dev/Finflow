<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Budget Management - FinFlow</title>
    <link rel="shortcut icon" href="finflow logo (1).png" />
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/budget.css" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <!-- Three.js Canvas Background -->
    <canvas id="bg-canvas"></canvas>

    <!-- Mobile Menu Toggle Button -->
    <div class="mobile-menu-toggle" id="mobileMenuToggle">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="logo">
            <img src="finflow logo (1).png" alt="" />
            <span>FinFlow</span>
        </div>

        <nav class="nav-menu">
            <a href="dashboard.html" class="nav-item">
                <i class="ph ph-squares-four"></i>
                <span>Dashboard</span>
            </a>
            <a href="expenses.html" class="nav-item">
                <i class="ph ph-receipt"></i>
                <span>Expenses</span>
            </a>
            <a href="budget.html" class="nav-item active">
                <i class="ph ph-wallet"></i>
                <span>Budgets</span>
            </a>
            <a href="analytics.html" class="nav-item">
                <i class="ph ph-chart-line-up"></i>
                <span>Analytics</span>
            </a>
            <a href="ai-insights.html" class="nav-item">
                <i class="ph ph-sparkle"></i>
                <span>AI Insights</span>
            </a>
            <a href="profile.html" class="nav-item">
                <i class="ph ph-user"></i>
                <span>Profile</span>
            </a>
        </nav>

        <a href="#" class="nav-item logout" id="logoutBtn">
            <i class="ph ph-sign-out"></i>
            <span>Logout</span>
        </a>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header -->
        <header class="header">
            <div class="search-bar">
                <i class="ph ph-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search budgets..." />
                <span class="search-shortcut">⌘K</span>
            </div>

            <div class="header-right">
                <div class="date-range" id="dateRangeBtn">
                    <i class="ph ph-calendar"></i>
                    <span id="selectedRange">This Month</span>
                    <i class="ph ph-caret-down"></i>
                </div>

                <div class="notification" id="notificationBtn" style="position:relative;cursor:pointer;">
    <i class="ph ph-bell" style="font-size:20px;color:white;"></i>
    <span class="notification-badge" id="notificationCount" style="position:absolute;top:-5px;right:-8px;background:#ef4444;color:white;font-size:10px;border-radius:50%;min-width:16px;height:16px;display:none;align-items:center;justify-content:center;"></span>
</div>
<div class="notification-dropdown" id="notificationDropdown">
    <div class="notification-header">
        <h3>Notifications</h3>
        <button class="mark-all-read" id="markAllReadBtn">Mark all read</button>
    </div>
    <div class="notifications-list" id="notificationsList"></div>
</div>

                <div class="user-info" id="userMenuBtn">
                    <div class="user-avatar" id="userAvatarIcon">U</div>
                    <div class="user-text">
                        <span class="welcome-text">Welcome back,</span>
                        <span class="user-name" id="userDisplayName">User</span>
                    </div>
                    <i class="ph ph-caret-down"></i>
                </div>
            </div>
        </header>

        <!-- Budget Content -->
        <div class="budget-content">
            <div class="page-header">
                <div>
                    <h1>Budget Management</h1>
                    <p>Plan and track your spending across categories</p>
                </div>
                <button class="add-budget-btn" id="openModalBtn">
                    <i class="ph ph-plus"></i>
                    Add Category
                </button>
            </div>

            <!-- Budget Summary Cards -->
            <div class="budget-summary">
                <div class="budget-summary-item">
                    <span class="summary-label">Monthly Budget</span>
                    <div class="summary-value" id="totalBudgetDisplay">$0.00</div>
                </div>
                <div class="budget-summary-item">
                    <span class="summary-label">Total Spent</span>
                    <div class="summary-value" id="totalSpentDisplay">$0.00</div>
                </div>
                <div class="budget-summary-item">
                    <span class="summary-label">Remaining</span>
                    <div class="summary-value" id="totalRemainingDisplay">$0.00</div>
                </div>
                <div class="overall-progress">
                    <div class="progress-header">
                        <span>Overall Progress</span>
                        <span class="progress-percentage">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- Budget Grid -->
            <div class="budget-grid" id="budgetGrid"></div>
        </div>
    </main>

    <!-- Add/Edit Budget Modal -->
    <div id="budgetModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Set Budget Category</h2>
                <span id="closeModalBtn" class="close-modal-btn">&times;</span>
            </div>
            <form id="budgetForm">
                <div class="form-group">
                    <label>Category Name</label>
                    <input type="text" id="catName" placeholder="e.g., Groceries" required>
                </div>
                <div class="form-group">
                    <label>Amount ($)</label>
                    <input type="number" id="catAmount" placeholder="500" required>
                </div>
                <div class="form-group">
                    <label>Color</label>
                    <select id="catColor">
                        <option value="blue">Blue</option>
                        <option value="green">Green</option>
                        <option value="purple">Purple</option>
                        <option value="orange">Orange</option>
                        <option value="red">Red</option>
                        <option value="pink">Pink</option>
                        <option value="indigo">Indigo</option>
                    </select>
                </div>
                <button type="submit" class="submit-budget-btn">Save Budget</button>
            </form>
        </div>
    </div>

    <script src="js/budget.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/notifications.js"></script>
</body>
</html>
