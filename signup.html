<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FinFlow</title>
    <link rel="shortcut icon" href="finflow logo (1).png" />
    <link rel="stylesheet" href="css/signup.css">
</head>
<body>
    <div class="signup-container">
        <div class="signup-card">
            <div class="signup-container">
                <a href="index.html" class="logo-circle">
                    <img src="finflow logo (1).png" alt="">
                </a>
            </div>

            <h1 class="signup-title">Create Account</h1>
            <p class="signup-subtitle">
                Start your journey with FinFlow 
                <svg class="shield-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 1L3 3V7C3 10.5 5.5 13.5 8 14.5C10.5 13.5 13 10.5 13 7V3L8 1Z" fill="#10b981" stroke="#10b981" stroke-width="1.5"/>
                    <path d="M6 8L7.5 9.5L10.5 6.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </p>

            <form class="signup-form">
                <div class="form-group">
                    <label for="email">Full Name</label>
                    <input 
                        type="text" 
                        id="text" 
                        name="text" 
                        placeholder="your name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <div class="password-header">
                        <label for="password">Password</label>
                        <a href="#" class="forgot-link">Forgot?</a>
                    </div>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Confirm Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••"
                        required
                    >
                </div>

                <a href="dashboard.html" type="submit" class="signup-button">Sign Up</a>

                <p class="login-text">
                    Already have an account? <a href="login.html" class="login-link">Login</a>
                </p>
            </form>
        </div>
    </div>
</body>
</html>
