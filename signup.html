<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <title>Sign Up - FinFlow</title>
    <link rel="shortcut icon" href="finflow logo (1).png" />
    <link rel="stylesheet" href="css/signup.css" />
  </head>
  <body>
    <div class="signup-container">
      <div class="signup-card">
        <div class="logo-container">
          <a href="index.html" class="logo-circle">
            <img src="finflow logo (1).png" alt="" />
          </a>
        </div>

        <h1 class="signup-title">Create Account</h1>
        <p class="signup-subtitle">
          Start your journey with FinFlow
          <svg
            class="shield-icon"
            width="16"
            height="16"
            viewBox="0 0 16 16"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M8 1L3 3V7C3 10.5 5.5 13.5 8 14.5C10.5 13.5 13 10.5 13 7V3L8 1Z"
              fill="#10b981"
              stroke="#10b981"
              stroke-width="1.5"
            />
            <path
              d="M6 8L7.5 9.5L10.5 6.5"
              stroke="white"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </p>

        <form class="signup-form" id="form-wrapper">
          <div class="form-group">
            <label for="fullname">Full Name</label>
            <input
              type="text"
              id="fullname"
              name="fullname"
              placeholder="Your name"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              required
            />

            <div class="form-group-icon">
              <i class="fa-regular fa-eye" id="fa-eye"></i>
              <i class="fa-regular fa-eye-slash" id="fa-eye-slash"></i>
            </div>
          </div>

          <div class="form-group">
            <label for="confirmpassword">Confirm Password</label>
            <input
              type="password"
              id="confirmpassword"
              name="confirmpassword"
              placeholder="••••••••"
              required
            />

            <div class="form-group-icon">
              <i class="fa-regular fa-eye" id="fa-eyes"></i>
              <i class="fa-regular fa-eye-slash" id="fa-eyes-slash"></i>
            </div>
          </div>

          <button type="submit" class="signup-button">Sign Up</button>

          <p class="login-text">
            Already have an account?
            <a href="login.html" class="login-link">Login</a>
          </p>
        </form>
      </div>
    </div>

    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="js/signup.js"></script>
  </body>
</html>
