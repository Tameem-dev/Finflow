<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

        <div class="logo">
            <img src="finflow logo (1).png" alt="" />

        <nav class="nav-menu">
            <a href="dashboad.html" class="nav-item">

                    <rect x="11" y="3" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5" />
                    <rect x="3" y="11" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5" />
                    <rect x="11" y="11" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5" />
                </svg>
                <span>Dashboard</span>
            </a>

            <a href="expenses.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="4" width="14" height="12" rx="2" stroke="currentColor" stroke-width="1.5" />

                </svg>
                <span>Expenses</span>
            </a>

            <a href="budget.html" class="nav-item active">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 10C4 9.44772 4.44772 9 5 9H15C15.5523 9 16 9.44772 16 10V15C16 15.5523 15.5523 16 15 16H5C4.44772 16 4 15.5523 4 15V10Z" stroke="currentColor" stroke-width="1.5" />
                    <path d="M7 9V6C7 4.34315 8.34315 3 10 3V3C11.6569 3 13 4.34315 13 6V9" stroke="currentColor" stroke-width="1.5" />
                </svg>
                <span>Budgets</span>
            </a>

            <a href="analytics.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 16L7 12L10 15L17 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M17 12V8H13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>Analytics</span>
            </a>

            <a href="profile.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.5" />

        <a href="#" class="nav-item logout" id="logoutBtn">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M13 14L17 10L13 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

            </svg>
            <span>Logout</span>
        </a>
    </aside>

    <main class="main-content">
        <header class="header">
            <div class="search-bar">
                <input type="text" placeholder="Search transactions, budgets..." />
            </div>

            <div class="header-right">
                <div class="user-info">
                    <div class="user-text">
                        <span class="welcome-text">Welcome back,</span>
                        <span class="user-name" id="userDisplayName">User</span>
                    </div>
                    <div class="user-avatar" id="userAvatarIcon">U</div>
                </div>
            </div>
        </header>

        <div class="budget-content">
            <div class="page-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <div>
                    <h1>Budget Management</h1>
                    <p>Plan and track your spending across categories</p>
                </div>
                <button class="add-budget-btn" id="openModalBtn" style="background: #4f46e5; color: white; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 500;">
                    + Add Category
                </button>
            </div>

            <div class="budget-summary">
                <div class="budget-summary-item">
                    <span class="summary-label">Monthly Budget</span>
                    <div class="summary-value" id="totalBudgetDisplay">$0.00</div>
                </div>
                <div class="budget-summary-item">
                    <span class="summary-label">Total Spent</span>
                    <div class="summary-value" id="totalSpentDisplay">$0.00</div>
                </div>
                <div class="budget-summary-item">
                    <span class="summary-label">Remaining</span>
                    <div class="summary-value" id="totalRemainingDisplay">$0.00</div>
                </div>
                <div class="overall-progress">
                    <div class="progress-header">
                        <span>Overall Progress</span>
                        <span class="progress-percentage">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <div class="budget-grid" id="budgetGrid"></div>
        </div>
    </main>

    <div id="budgetModal" class="modal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5);">
        <div class="modal-content" style="background: white; margin: 10% auto; padding: 25px; border-radius: 12px; width: 400px; position: relative;">
            <span id="closeModalBtn" style="position: absolute; right: 20px; cursor: pointer; font-size: 20px;">✕</span>
            <h2 style="margin-bottom: 20px">Set Budget Category</h2>
            <form id="budgetForm">
                <div style="margin-bottom: 15px">
                    <label style="display: block; margin-bottom: 5px">Category Name</label>
                    <input type="text" id="catName" placeholder="e.g. Groceries" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                </div>
                <div style="margin-bottom: 15px">
                    <label style="display: block; margin-bottom: 5px">Amount ($)</label>
                    <input type="number" id="catAmount" placeholder="500" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                </div>
                <div style="margin-bottom: 20px">
                    <label style="display: block; margin-bottom: 5px">Color</label>
                    <select id="catColor" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                        <option value="blue">Blue</option>
                        <option value="green">Green</option>
                        <option value="purple">Purple</option>
                        <option value="orange">Orange</option>
                        <option value="red">Red</option>
                    </select>
                </div>
                <button type="submit" style="width: 100%; background: #4f46e5; color: white; padding: 12px; border: none; border-radius: 8px; cursor: pointer;">Save Budget</button>
            </form>
        </div>
    </div>

    <script src="js/budget.js"></script>
    <script src="js/logout.js"></script>
</body>
</html>
