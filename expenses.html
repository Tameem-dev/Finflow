<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Expenses - FinFlow</title>
    <link rel="stylesheet" href="css/expenses.css">
    <link rel="shortcut icon" href="finflow logo (1).png" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
    <!-- Three.js Canvas Background -->
    <canvas id="bg-canvas"></canvas>

    <!-- Mobile Menu Toggle Button -->
    <div class="mobile-menu-toggle" id="mobileMenuToggle">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="logo">
            <img src="finflow logo (1).png" alt="" />
            <span>FinFlow</span>
        </div>

        <nav class="nav-menu">
            <a href="dashboard.html" class="nav-item">
                <i class="ph ph-squares-four"></i>
                <span>Dashboard</span>
            </a>

            <a href="expenses.html" class="nav-item active">
                <i class="ph ph-receipt"></i>
                <span>Expenses</span>
            </a>

            <a href="budget.html" class="nav-item">
                <i class="ph ph-wallet"></i>
                <span>Budgets</span>
            </a>

            <a href="analytics.html" class="nav-item">
                <i class="ph ph-chart-line-up"></i>
                <span>Analytics</span>
            </a>

            <a href="#" class="nav-item">
                <i class="ph ph-sparkle"></i>
                <span>AI Insights</span>
            </a>

            <a href="profile.html" class="nav-item">
                <i class="ph ph-user"></i>
                <span>Profile</span>
            </a>
        </nav>

        <a href="#" class="nav-item logout" id="logoutBtn">
            <i class="ph ph-sign-out"></i>
            <span>Logout</span>
        </a>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header -->
        <header class="header">
            <div class="search-bar">
                <i class="ph ph-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search transactions, budgets..." />
            </div>

            <div class="header-right">
                <div class="notification">
                    <i class="ph ph-bell"></i>
                    <span class="notification-badge"></span>
                </div>

                <div class="user-info">
                    <div class="user-text">
                        <span class="welcome-text">Welcome back,</span>
                        <span class="user-name"></span>
                    </div>
                    <div class="user-avatar" id="userAvatar">J</div>
                </div>
            </div>
        </header>

        <!-- Expenses Section -->
        <div class="expenses-container">
            <div class="expenses-header">
                <div>
                    <h1>Expenses</h1>
                    <p>Track and manage your expenses</p>
                </div>
                <button class="btn-add-expense" id="addExpenseBtn">
                    <i class="ph ph-plus"></i>
                    Add Expense
                </button>
            </div>

            <!-- Total Card -->
            <div class="total-card">
                <div class="total-left">
                    <span class="total-label">Total Expenses</span>
                    <h2 class="total-amount" id="totalAmount">$0.00</h2>
                </div>
                <div class="total-right">
                    <span class="transactions-label">Transactions</span>
                    <h2 class="transactions-count" id="transactionCount">0</h2>
                </div>
            </div>

            <!-- Expenses Table -->
            <div class="expenses-table-container">
                <div class="table-wrapper">
                    <table class="expenses-table">
                        <thead>
                            <tr>
                                <th>Description</th>
                                <th>Amount</th>
                                <th>Category</th>
                                <th>Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="expensesTableBody">
                            <!-- Expenses will be inserted here dynamically -->
                        </tbody>
                    </table>
                </div>

                <div id="emptyState" class="empty-state">
                    <i class="ph ph-receipt"></i>
                    <p>No expenses yet. Add your first expense to get started!</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Add/Edit Expense Modal -->
    <div id="expenseModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Expense</h2>
                <button class="close-btn" id="closeModal">
                    <i class="ph ph-x"></i>
                </button>
            </div>

            <form id="expenseForm">
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" required placeholder="e.g., Gas Station" />
                </div>

                <div class="form-group">
                    <label for="amount">Amount ($)</label>
                    <input type="number" id="amount" step="0.01" required placeholder="0.00" />
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select category</option>
                        <option value="Food & Dining">Food & Dining</option>
                        <option value="Transportation">Transportation</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Healthcare">Healthcare</option>
                        <option value="Education">Education</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required />
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn-submit" id="submitBtn">Add Expense</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/expenses.js"></script><!-- Theme JS (shared) - Add BEFORE other page-specific JS -->
<script src="js/theme.js"></script>
</body>
</html>
